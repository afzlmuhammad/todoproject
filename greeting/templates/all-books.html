<!DOCTYPE html>
<html>
<head>
    <title>All Books</title>
</head>
<body>
    <h1>All Books</h1>

    {% for book in books %}
        <p>Title: {{ book.title }}</p>
        <p>Author: {{ book.author }}</p>
        <hr>
    {% empty %}
        <p>No books have been added yet.</p>
    {% endfor %}

    <a href="/">Add New Book</a>
</body>
</html>
